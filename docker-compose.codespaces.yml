services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: expert-brain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: expert_brain
      POSTGRES_USER: expert_brain
      POSTGRES_PASSWORD: expert_brain
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,ai-service
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,ai-service
    ports:
      - "15432:5432"
    volumes:
      - postgres_codespaces_data:/var/lib/postgresql/data
      - ./deployment/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expert_brain -d expert_brain"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: expert-brain-redis
    restart: unless-stopped
    environment:
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,ai-service
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,ai-service
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expert-brain-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: expert_brain
      DB_USERNAME: expert_brain
      DB_PASSWORD: expert_brain
      REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_EMBEDDING_TIMEOUT: 180
      AI_SERVICE_PARSE_TIMEOUT: 240
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,ai-service
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,ai-service
    ports:
      - "18080:8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8080

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: expert-brain-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      EMBEDDING_PROVIDER: mock
      EMBEDDING_MODEL: mock-embedding-1024
      EMBEDDING_MODEL_PATH: ""
      EMBEDDING_DIMENSION: 1024
      EMBEDDING_DEVICE: cpu
      EMBEDDING_PRELOAD: "false"
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,ai-service
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,ai-service
    ports:
      - "18000:8000"
    volumes:
      - ./ai-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_codespaces_data:
