services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: expert-brain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: expert_brain
      POSTGRES_USER: expert_brain
      POSTGRES_PASSWORD: expert_brain
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expert_brain -d expert_brain"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: expert-brain-redis
    restart: unless-stopped
    environment:
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expert-brain-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
    ports:
      - "18080:8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8080

  backend-queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expert-brain-backend-queue
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      QUEUE_CONNECTION: database
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    command: sh -lc "nice -n 10 php artisan queue:work database --queue=default --sleep=2 --tries=1 --timeout=900 --memory=384 --max-jobs=100 --max-time=3600"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: expert-brain-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    environment:
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
    ports:
      - "18000:8000"
    volumes:
      - ./ai-service:/app
      - ${EXPERT_BRAIN_MODELS_DIR:-./models}:/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:22-alpine
    container_name: expert-brain-frontend
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:8080
      NO_PROXY: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
      no_proxy: localhost,127.0.0.1,postgres,redis,backend,backend-queue,ai-service,frontend
    ports:
      - "15173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
