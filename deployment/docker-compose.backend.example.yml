# Merge this service into docker-compose.yml after Laravel is initialized.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expert-brain-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan serve --host=0.0.0.0 --port=8080
